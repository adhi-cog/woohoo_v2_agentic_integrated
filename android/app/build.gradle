            buildConfigField "String", "WOOHOO_BASE_URL", '"https://enterprise.heywoohoo.com/v1/"'
            buildConfigField "String", "LOCAL_NLP_BASE_URL", '"http://127.0.0.1:9001/v1/"'
            buildConfigField "String", "SOCKET_URL_HUB", '"https://socket.heywoohoo.com"'
            resValue "string", "app_name", "WooHoo Hub"
            versionNameSuffix getVersionName("debug-landscape")
            debuggable true
            signingConfig signingConfigs.debug
            manifestPlaceholders.screenOrientation = "landscape"
            manifestPlaceholders = [sharedUserId: "default.uid"]
        }

        releaseLandscape {
            buildConfigField "String", "WOOHOO_BASE_URL", '"https://enterprise.heywoohoo.com/v1/"'
            buildConfigField "String", "LOCAL_NLP_BASE_URL", '""'
            buildConfigField "String", "SOCKET_URL_HUB", '"https://socket.heywoohoo.com"'
            resValue "string", "app_name", "WooHoo Hub"
            versionNameSuffix getVersionName("release-landscape")
            debuggable true
            signingConfig signingConfigs.release
            manifestPlaceholders.screenOrientation = "landscape"
            manifestPlaceholders = [sharedUserId: "default.uid"]
        }


        debugSandBox {
            buildConfigField "String", "WOOHOO_BASE_URL", '"https://dev.enterprise.heywoohoo.com/v1/"'
            buildConfigField "String", "LOCAL_NLP_BASE_URL", '""'
            buildConfigField "String", "SOCKET_URL_HUB", '"https://dev.socket.heywoohoo.com"'
            resValue "string", "app_name", "WooHoo Sandbox Hub"
            applicationIdSuffix ".sandbox"
            versionNameSuffix getVersionName("debug-sandbox")
            debuggable true
            signingConfig signingConfigs.debug
            manifestPlaceholders = [sharedUserId: "default.uid"]
        }

        releaseSandBox {
            buildConfigField "String", "WOOHOO_BASE_URL", '"https://dev.enterprise.heywoohoo.com/v1/"'
            buildConfigField "String", "LOCAL_NLP_BASE_URL", '""'
            buildConfigField "String", "SOCKET_URL_HUB", '"https://dev.socket.heywoohoo.com"'
            resValue "string", "app_name", "WooHoo Sandbox Hub"
            applicationIdSuffix ".sandbox"
            versionNameSuffix getVersionName("release-sandbox")
            debuggable true
            signingConfig signingConfigs.release
            manifestPlaceholders = [sharedUserId: "android.uid.system"]
        }
        android.applicationVariants.all { variant ->
            variant.outputs.all { output ->
                output.outputFileName =  "wh-" + "${variant.name}" + "_" + "${variant.versionCode}" + ".apk"
            }
        }
    }

    configurations {
        all {
            resolutionStrategy.force 'com.google.code.findbugs:jsr305:3.0.2'
            resolutionStrategy.force "androidx.annotation:annotation:1.0.0"
            exclude group: 'org.json', module: 'json'
        }
    }
    allprojects {
        repositories {
            maven { url "https://jitpack.io" }
            maven { url "https://maven.mozilla.org/maven2/" }

            flatDir {
                dirs 'libs'
            }
        }
    }
    lintOptions {
        abortOnError false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES']
        }
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

