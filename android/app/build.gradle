        buildConfigField "String", "GEMINI_INTENT_BASE_URL", buildConfigString(geminiIntentBaseUrl)
        buildConfigField "String", "AGENTIC_BASE_URL", buildConfigString(agenticBaseUrl)
       /* ndk {
