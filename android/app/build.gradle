apply from: "ktlint.gradle"
apply plugin: 'com.google.firebase.crashlytics'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'org.jetbrains.kotlin.android'

repositories {
    // SNSR_REPOSITORY in gradle.properties points at whichever machine last set it. Fall
    // back to the copy vendored in this repo so a fresh clone builds without anyone having
    // to find the Sensory SDK first.
    def sensoryRepoPath = resolveSensoryRepoPath(SNSR_REPOSITORY)
    if (sensoryRepoPath == null || !file(sensoryRepoPath).exists()) {
        sensoryRepoPath = "${project.rootDir}/sensory-m2repository"
    }
    google()
    maven { url "https://jitpack.io" }
    maven { url "https://download.linphone.org/releases/android/maven_repository/" }
    maven { url "https://maven.mozilla.org/maven2/" }
    if (sensoryRepoPath) {
        maven {
            url uri(sensoryRepoPath)
        }
    }
    mavenLocal()
    mavenCentral()
    flatDir {
        dirs 'libs'
    }
}

apply from: '../gradle/model-utils.gradle'
apply from: "${project.rootDir}/versions.gradle"

static def resolveSensoryRepoPath(String rawPath) {
    if (rawPath == null) {
        return null
    }
    def normalized = rawPath.trim().replace('\\:', ':').replace('\\', '/')
    if (normalized ==~ '^/[A-Za-z]:/.*') {
        normalized = normalized.substring(1)
    }
    return normalized
}



configurations {
    snsr_model
    all*.exclude group: 'com.android.support', module: 'support-v4'
}

static def getDate() {
    new Date().format('ddMMyy_HHmm')
}

def useChirp3Asr = (project.findProperty("USE_CHIRP3_ASR") ?: System.getenv("USE_CHIRP3_ASR") ?: "false")
        .toString()
        .toBoolean()

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

def geminiIntentBaseUrl = (project.findProperty("GEMINI_INTENT_BASE_URL")
        ?: System.getenv("GEMINI_INTENT_BASE_URL")
        ?: localProperties.getProperty("geminiIntentBaseUrl")
        ?: "")

// Base URL of the agentic gateway. Same resolution order as the Gemini one above, so a
// developer can point a build at a laptop from local.properties without touching git.
// Empty means the agentic engine is not available in this build and the device falls back
// to whichever NLP engine it used before.
def agenticBaseUrl = (project.findProperty("AGENTIC_BASE_URL")
        ?: System.getenv("AGENTIC_BASE_URL")
        ?: localProperties.getProperty("agenticBaseUrl")
        ?: "")
        .toString()

static def buildConfigString(String value) {
    return "\"" + value.replace("\\", "\\\\").replace("\"", "\\\"") + "\""
}

def getVersionName(variant) {
     "_${variant}" + "_" + getDate()
}

