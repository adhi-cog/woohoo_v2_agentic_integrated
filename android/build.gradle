// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext.kotlin_version = '1.9.0'
    ext.google_services = '4.3.4'


    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        maven { url "https://maven.mozilla.org/maven2/" }
        maven { url "https://download.linphone.org/releases/android/maven_repository/" }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.1.3'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "com.google.gms:google-services:$google_services"
        classpath 'com.google.firebase:firebase-crashlytics-gradle:2.6.1'
        classpath 'com.google.protobuf:protobuf-gradle-plugin:0.9.4'
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        def sensoryRepoPath = project.findProperty("SNSR_REPOSITORY")
        if (sensoryRepoPath != null) {
            def normalizedSensoryRepoPath = sensoryRepoPath.toString().trim().replace('\\:', ':').replace('\\', '/')
            if (normalizedSensoryRepoPath ==~ '^/[A-Za-z]:/.*') {
                normalizedSensoryRepoPath = normalizedSensoryRepoPath.substring(1)
            }
            maven { url uri(normalizedSensoryRepoPath) }
        }
        google()
        mavenCentral()
        maven { url "https://download.linphone.org/releases/android/maven_repository/" }
        maven { url "https://www.jitpack.io" }
        maven { url "https://jitpack.io" }
        maven { url "https://maven.mozilla.org/maven2/" }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
