// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext.kotlin_version = '1.9.0'
    ext.google_services = '4.3.4'


    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        maven { url "https://maven.mozilla.org/maven2/" }
        maven { url "https://download.linphone.org/releases/android/maven_repository/" }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.1.3'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "com.google.gms:google-services:$google_services"
        classpath 'com.google.firebase:firebase-crashlytics-gradle:2.6.1'
        classpath 'com.google.protobuf:protobuf-gradle-plugin:0.9.4'
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

/**
 * A Windows path written into gradle.properties arrives escaped ("C\:/Users/..."), and a
 * leading-slash drive form ("/C:/...") is not a path Java can stat. Normalising both in one
 * place keeps the existence check and the maven url agreeing with each other.
 */
static String normalizeRepoPath(String raw) {
    def normalized = raw.trim().replace('\\:', ':').replace('\\', '/')
    if (normalized ==~ '^/[A-Za-z]:/.*') {
        normalized = normalized.substring(1)
    }
    return normalized
}

allprojects {
    repositories {
        def sensoryRepoPath = project.findProperty("SNSR_REPOSITORY")
        // SNSR_REPOSITORY in gradle.properties points at whichever machine last set it, so
        // fall back to the copy vendored in this repo. A fresh clone then builds without
        // anyone having to locate the Sensory SDK first.
        if (sensoryRepoPath == null
                || !new File(normalizeRepoPath(sensoryRepoPath.toString())).exists()) {
            sensoryRepoPath = new File(rootDir, "sensory-m2repository").absolutePath
        }
        if (sensoryRepoPath != null) {
            maven { url uri(normalizeRepoPath(sensoryRepoPath.toString())) }
        }
        google()
        mavenCentral()
        maven { url "https://download.linphone.org/releases/android/maven_repository/" }
        maven { url "https://www.jitpack.io" }
        maven { url "https://jitpack.io" }
        maven { url "https://maven.mozilla.org/maven2/" }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
